name: Build Android

on:
  workflow_dispatch:
    inputs:
      game_id:
        description: 'GameSpec id to build'
        required: true
        default: 'game01'
      build_type:
        description: 'apk or aab'
        required: false
        default: 'apk'

jobs:
  build:
    # CI builds run on the FORK's runner only. The runner registered on this
    # repository is the pc-control channel (see pc-control.yml) and must not
    # start Unity builds beside it on the same machine.
    if: github.repository_owner != 'gojo3105-a11'
    runs-on: [self-hosted, Windows]
    env:
      GAME_ID: ${{ github.event.inputs.game_id }}
      BUILD_TYPE: ${{ github.event.inputs.build_type }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate scene
        shell: powershell
        run: |
          .\scripts\ci\wait-for-unity.ps1 -SentinelName generate -UnityArgs @(
            '-batchmode', '-nographics', '-projectPath', '${{ github.workspace }}',
            '-executeMethod', 'GameFactory.Editor.GameFactoryGenerator.GenerateFromCommandLine',
            '-gameSpec', "GameSpecs/$env:GAME_ID.json",
            '-logFile', '${{ github.workspace }}\Logs\unity-generate.log'
          )
          exit $LASTEXITCODE

      # ANDROID_KEYSTORE_PATH must point to a keystore file already present
      # on this runner - see docs/BUILD.md for how to provision one. Without
      # it, BuildAndroid falls back to Unity's debug signing (fine for
      # testing, not for a Play Store release).
      - name: Build Android package
        shell: powershell
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: |
          .\scripts\ci\wait-for-unity.ps1 -SentinelName build -TimeoutMinutes 60 -UnityArgs @(
            '-batchmode', '-nographics', '-projectPath', '${{ github.workspace }}',
            '-executeMethod', 'GameFactory.Editor.BuildAndroid.BuildFromCommandLine',
            '-gameId', "$env:GAME_ID", '-buildType', "$env:BUILD_TYPE",
            '-logFile', '${{ github.workspace }}\Logs\unity-build.log'
          )
          exit $LASTEXITCODE

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GAME_ID }}-${{ env.BUILD_TYPE }}
          path: |
            Builds/${{ env.GAME_ID }}/**
            Logs/unity-build.log
            Logs/unity-build-report.log
          if-no-files-found: warn
