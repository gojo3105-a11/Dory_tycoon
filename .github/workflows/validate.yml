name: Validate GameSpecs

on:
  push:
    paths:
      - 'GameSpecs/*.json'
      - 'Assets/GameFactory/Core/GameSpec/**'
      - 'Assets/GameFactory/Editor/GameValidator.cs'
      - 'Assets/GameFactory/Editor/BundleIdUtility.cs'
  pull_request:
    paths:
      - 'GameSpecs/*.json'
      - 'Assets/GameFactory/Core/GameSpec/**'
      - 'Assets/GameFactory/Editor/GameValidator.cs'
      - 'Assets/GameFactory/Editor/BundleIdUtility.cs'
  workflow_dispatch:

jobs:
  validate:
    # CI builds run on the FORK's runner only. The runner registered on this
    # repository is the pc-control channel (see pc-control.yml) and must not
    # start Unity builds beside it on the same machine.
    if: github.repository_owner != 'gojo3105-a11'
    runs-on: [self-hosted, Windows]
    steps:
      - uses: actions/checkout@v4

      - name: Run GameValidator
        shell: powershell
        run: |
          .\scripts\ci\wait-for-unity.ps1 -SentinelName validate -UnityArgs @(
            '-batchmode', '-nographics', '-projectPath', '${{ github.workspace }}',
            '-executeMethod', 'GameFactory.Editor.GameValidator.ValidateFromCommandLine',
            '-logFile', '${{ github.workspace }}\Logs\unity-validate.log'
          )
          exit $LASTEXITCODE

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-logs
          path: |
            Logs/validation.log
            Logs/unity-validate.log
          if-no-files-found: ignore
